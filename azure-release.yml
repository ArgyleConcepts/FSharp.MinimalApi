name: release-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
  - name: publishPackages
    displayName: Publish verified packages to NuGet.org
    type: boolean
    default: false

pool:
  vmImage: ubuntu-latest

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

stages:
  - stage: Validate
    jobs:
      - job: Packages
        steps:
          - checkout: self
            fetchDepth: 0
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              useGlobalJson: true
          - script: dotnet restore FSharp.MinimalApi.sln
            displayName: Restore solution
          - script: dotnet tool restore
            displayName: Restore tools
          - script: dotnet build FSharp.MinimalApi.sln --configuration Release --no-restore
            displayName: Build solution
          - script: dotnet fsi eng/fsharp-analysis/Run.fsx
            displayName: Analyze F#
          - script: dotnet test --solution FSharp.MinimalApi.sln --configuration Release --no-build --no-restore
            displayName: Run tests
          - script: dotnet fantomas check .
            displayName: Check formatting
          - script: bash eng/verify-packages.sh
            displayName: Verify and retain release packages
            env:
              VERIFY_PACKAGE_OUTPUT_DIRECTORY: $(Build.ArtifactStagingDirectory)/packages
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/packages
              artifact: packages

  # Compile out publishing and its secret group during validation-only runs.
  - ${{ if eq(parameters.publishPackages, true) }}:
      - stage: Publish
        dependsOn: Validate
        condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))
        jobs:
          - deployment: NuGet
            environment: fsharp-minimalapi-nuget
            variables:
              - group: fsharp-minimalapi-nuget-release
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: none
                    - download: current
                      artifact: packages
                    - task: UseDotNet@2
                      inputs:
                        packageType: sdk
                        version: 10.0.x
                    - bash: |
                        set -euo pipefail
                        if [[ -z "$NUGET_API_KEY" || "$NUGET_API_KEY" == '$(NUGET_API_KEY)' ]]; then
                          echo "Missing release-only NuGet API key." >&2
                          exit 1
                        fi
                        # Betas come from develop; stable releases come from master.
                        shopt -s nullglob
                        packages=("$PACKAGE_DIRECTORY"/*.nupkg)
                        if [[ ${#packages[@]} -ne 2 ]]; then
                          echo "Expected exactly two release packages." >&2
                          exit 1
                        fi
                        for package in "${packages[@]}"; do
                          filename="${package##*/}"
                          case "$SOURCE_BRANCH" in
                            refs/heads/develop)
                              if [[ ! "$filename" =~ ^ArgyleConcepts\.FSharp\.MinimalApi(\.OpenApi)?\.[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9.-]+\.nupkg$ ]]; then
                                echo "Only prerelease packages can publish from develop: $filename" >&2
                                exit 1
                              fi
                              ;;
                            refs/heads/master)
                              if [[ ! "$filename" =~ ^ArgyleConcepts\.FSharp\.MinimalApi(\.OpenApi)?\.[0-9]+\.[0-9]+\.[0-9]+\.nupkg$ ]]; then
                                echo "Only stable packages can publish from master: $filename" >&2
                                exit 1
                              fi
                              ;;
                            *) echo "Publishing is restricted to develop and master." >&2; exit 1 ;;
                          esac
                        done
                        for package in "$PACKAGE_DIRECTORY"/*.nupkg; do
                          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
                        done
                        # Explicit symbol pushes also allow retry after a partial publish.
                        for symbols in "$PACKAGE_DIRECTORY"/*.snupkg; do
                          dotnet nuget push "$symbols" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
                        done
                      displayName: Publish verified packages and symbols
                      env:
                        NUGET_API_KEY: $(NUGET_API_KEY)
                        PACKAGE_DIRECTORY: $(Pipeline.Workspace)/packages
                        SOURCE_BRANCH: $(Build.SourceBranch)
